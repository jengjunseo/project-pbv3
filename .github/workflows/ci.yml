name: PBV3.1 Quality Gate

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run security:scan
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_not_a_real_key
          PB_APP_ORIGIN: http://localhost:3000
          PB_FINGERPRINT_SECRET: ci-fingerprint-secret-at-least-32-characters
          PB_MAINTENANCE_SECRET: ci-maintenance-secret-at-least-32-characters
          CRON_SECRET: ci-cron-secret-at-least-32-characters
