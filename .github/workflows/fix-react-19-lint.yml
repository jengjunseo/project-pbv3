name: Apply React 19 workspace fix

on:
  push:
    branches: ["agent/pbv3.1-restore"]
    paths: [".react-fix/ready"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch workspace lifecycle
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workspace = Path('src/components/PBWorkspace.tsx')
          source = workspace.read_text()
          source = source.replace(
              '  useEffect,\n  useMemo,',
              '  useEffect,\n  useEffectEvent,\n  useMemo,',
          )
          source = source.replace('  const saveHandlerRef = useRef<() => void>(() => undefined);\n', '')
          source = source.replace('  useEffect(() => { activeIdRef.current = id; }, [id]);\n', '')

          effect_start = source.index('  useEffect(() => {\n    activeIdRef.current = id;')
          effect_end = source.index('\n\n  useEffect(() => {\n    const onFocus', effect_start)
          new_effect = '\n'.join([
              '  useEffect(() => {',
              '    const loadEpoch = loadEpochRef.current;',
              '    const saveEpoch = saveEpochRef.current;',
              '    const controller = new AbortController();',
              '    const epoch = loadEpoch.begin();',
              '    const requestId = id;',
              '',
              '    void (async () => {',
              '      try {',
              '        const response = await fetch(`/api/slots/${formatSlotId(requestId)}`, {',
              '          cache: "no-store",',
              '          signal: controller.signal,',
              '        });',
              '        const data = await parseApiResponse<SlotReadResponse>(response);',
              '        if (!loadEpoch.isCurrent(epoch) || activeIdRef.current !== requestId) return;',
              '        const next = data.empty ? null : data.slot;',
              '        setSlot(next);',
              '        setText(next?.text ?? "");',
              '        setState("idle");',
              '      } catch (cause) {',
              '        if (controller.signal.aborted) return;',
              '        if (!loadEpoch.isCurrent(epoch) || activeIdRef.current !== requestId) return;',
              '        setState("load-error");',
              '        setMessage(messageFrom(cause, "슬롯을 불러오지 못했습니다."));',
              '      }',
              '    })();',
              '',
              '    return () => {',
              '      controller.abort();',
              '      loadEpoch.invalidate();',
              '      saveEpoch.invalidate();',
              '      activeSaveAbortRef.current?.abort();',
              '    };',
              '  }, [id]);',
          ])
          source = source[:effect_start] + new_effect + source[effect_end:]

          shortcut_start = source.index('  saveHandlerRef.current = () => { void save(); };')
          shortcut_end = source.index('\n\n  async function clear()', shortcut_start)
          new_shortcut = '\n'.join([
              '  const saveFromShortcut = useEffectEvent(() => {',
              '    void save();',
              '  });',
              '',
              '  useEffect(() => {',
              '    const onKeyDown = (event: KeyboardEvent) => {',
              '      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {',
              '        event.preventDefault();',
              '        saveFromShortcut();',
              '      }',
              '    };',
              '    window.addEventListener("keydown", onKeyDown);',
              '    return () => window.removeEventListener("keydown", onKeyDown);',
              '  }, []);',
          ])
          workspace.write_text(source[:shortcut_start] + new_shortcut + source[shortcut_end:])

          page = Path('src/app/slot/[id]/page.tsx')
          page_source = page.read_text()
          old_page = 'return <PBWorkspace id={id} maxFileBytes={MAX_FILE_BYTES} />;'
          if old_page not in page_source:
              raise SystemExit('workspace page call not found')
          page.write_text(page_source.replace(
              old_page,
              'return <PBWorkspace key={id} id={id} maxFileBytes={MAX_FILE_BYTES} />;',
          ))
          PY
          rm -rf .react-fix
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align PB workspace with React 19 effects"
          git push origin HEAD:agent/pbv3.1-restore
