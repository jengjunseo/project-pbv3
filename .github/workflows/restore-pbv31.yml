name: Restore PBV3.1 source packet

on:
  push:
    branches: ["agent/pbv3.1-restore"]
    paths: [".restore/ready"]

permissions:
  contents: write

concurrency:
  group: pbv31-restore
  cancel-in-progress: true

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore verified source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .restore/sha256
          test -f .restore/chunk-sha256
          cat <<'SUMS' | sha256sum --check --strict
          8f0f9338de5d3335fddd2d5d4e7624dde3ad524348ec92e21a99c87385c9f1ab  .restore/e-00-0.b64
          b0795c1d02c1c37dd8f7bdafb6dfe78111a694505d2e042b2c63cf9df68ff559  .restore/e-00-1
          739c7bb56ddabb20679822db6fbe0b2cfc7595d045f0271ed5d02b2ec65013a4  .restore/e-01-0.b64
          9bdf9b07751f6170aeaac0bb2a17f0df48d59dbb5adb036b01f0d5549bbd5d4f  .restore/e-01-1.b64
          SUMS
          base64 --decode .restore/e-00-0.b64 > .restore/e-00-0
          base64 --decode .restore/e-01-0.b64 > .restore/e-01-0
          base64 --decode .restore/e-01-1.b64 > .restore/e-01-1
          cat <<'SUMS' | sha256sum --check --strict
          f4a07e59ea6890f021c1245a0ad29d621fe944b90c9d7f3de63c97d845071a4c  .restore/e-00-0
          b0795c1d02c1c37dd8f7bdafb6dfe78111a694505d2e042b2c63cf9df68ff559  .restore/e-00-1
          8c09d938974b7a92809f0b9ff98acbf925b2bd29674a26657791201233d17961  .restore/e-01-0
          aa30744fd1c310a3fe870523bdcc081f04e940dc53a7cc3e583d5282fb89a983  .restore/e-01-1
          SUMS
          cat .restore/e-00-0 .restore/e-00-1 > .restore/q-00a-0
          cat .restore/e-01-0 .restore/e-01-1 > .restore/q-01b-1
          cat <<'SUMS' | sha256sum --check --strict
          20fb5823f475eb6417ef42684b6d8fd3f59f388bff50f5ca7316e36400a3f66e  .restore/q-00a-0
          6ee0c17f328f877c32556477d6660827d29ced9c778f7514532887c200b4ab80  .restore/q-00a-1
          524913fde3b0d77ed8f8e8204d4c87c5fb0c6155d37ef5ebca9d67efcddaa5bc  .restore/q-01b-0
          cf2627edbca02d00635591b514e29401f5cb46d1256bfc8f3194c13f858cde92  .restore/q-01b-1
          SUMS
          cat .restore/q-00a-0 .restore/q-00a-1 > .restore/fix-00a
          cat .restore/q-01b-0 .restore/q-01b-1 > .restore/fix-01b
          cat <<'SUMS' | sha256sum --check --strict
          048f5f454cca6eb1d8476a36c892e35467839ab2384dd5fe2f81d3bd630c52e7  .restore/fix-00a
          129303a8e7df8182c5fd46e6fcadd365d5621796fa96dbccf142e19d912bc8d1  .restore/fix-00b
          81f9ecd03acd6216bf560b645f17aa50464116cf021e6c8e874012f030e158db  .restore/fix-01a
          4d99e4e3c5630f8270687be365b3d071197bc6d3b17f44a163654b655a2133c8  .restore/fix-01b
          SUMS
          cat .restore/fix-00a .restore/fix-00b > .restore/chunk-00
          cat .restore/fix-01a .restore/fix-01b > .restore/chunk-01
          sha256sum --check --strict .restore/chunk-sha256
          cat .restore/chunk-[0-9][0-9] > /tmp/pbv31.b64
          base64 --decode /tmp/pbv31.b64 > /tmp/pbv31.zip
          echo "$(cat .restore/sha256)  /tmp/pbv31.zip" | sha256sum --check --strict
          rm -rf /tmp/pbv31-source
          mkdir -p /tmp/pbv31-source
          unzip -q /tmp/pbv31.zip -d /tmp/pbv31-source
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.restore/' \
            --exclude '.github/workflows/restore-pbv31.yml' \
            /tmp/pbv31-source/ ./
          rm -rf .restore
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore PBV3.1 persistence boundary"
          git push origin HEAD:agent/pbv3.1-restore
