name: Restore PBV3.1 source packet

on:
  push:
    branches: ["agent/pbv3.1-restore"]
    paths: [".restore/**", ".github/workflows/restore-pbv31.yml"]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore verified source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .restore/sha256
          cat .restore/chunk-* > /tmp/pbv31.b64
          base64 --decode /tmp/pbv31.b64 > /tmp/pbv31.zip
          echo "$(cat .restore/sha256)  /tmp/pbv31.zip" | sha256sum --check --strict
          rm -rf /tmp/pbv31-source
          mkdir -p /tmp/pbv31-source
          unzip -q /tmp/pbv31.zip -d /tmp/pbv31-source
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.restore/' \
            --exclude '.github/workflows/restore-pbv31.yml' \
            /tmp/pbv31-source/ ./
          rm -rf .restore
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore PBV3.1 persistence boundary"
          git push origin HEAD:agent/pbv3.1-restore
